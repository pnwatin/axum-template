services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${APP_DATABASE__USER:-postgres}
      POSTGRES_PASSWORD: ${APP_DATABASE__PASSWORD:-password}
      POSTGRES_DB: ${APP_DATABASE__NAME:-postgres}
    ports:
      - "${APP_DATABASE__PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
