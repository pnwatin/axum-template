[package]
name = "axum-template"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tower = { version = "0.5.3" }
tower-http = { version = "0.7.1", features = [
  "cors",
  "trace",
  "util",
  "request-id",
  "sensitive-headers",
  "catch-panic",
  "timeout",
  "compression-full",
] }

tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }

utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"

serde = { version = "1.0.229", features = ["derive"] }
serde-aux = { version = "4.7.0" }
serde_json = "1.0.151"

tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = { version = "0.1.44" }

secrecy = { version = "0.10.3", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }

thiserror = { version = "2.0.21" }
anyhow = { version = "1.0.104" }

bon = { version = "3.10.1" }
figment = { version = "0.10.19", features = ["env", "yaml"] }
dotenvy = { version = "0.15.7" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
